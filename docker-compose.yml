services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: middleware
      POSTGRES_PASSWORD: middleware
      POSTGRES_DB: middleware
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U middleware"]
      interval: 2s
      timeout: 3s
      retries: 30

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  middleware:
    build:
      context: .
      dockerfile: apps/middleware/Dockerfile
    environment:
      DATABASE_URL: postgresql://middleware:middleware@postgres:5432/middleware
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:-demo-secret-change-me}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      redis:
        condition: service_started

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

  emulator:
    build:
      context: .
      dockerfile: apps/emulator/Dockerfile
    environment:
      MQTT_URL: mqtt://mosquitto:1883
    ports:
      - "8081:8081"
      - "5020:5020"
      - "5021:5021"
      - "8090:8090"
    depends_on:
      mosquitto:
        condition: service_started
