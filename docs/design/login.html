<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · AGV·AMR 통합 관제</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
   Put this @layer first; product CSS outside the layer wins ordinary layout rules.
   Native hidden and closed-dialog states take precedence over component display rules. */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }

  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* functional inline SVG icons opt into bounded geometry; content SVGs keep their own */
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }

  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */

/* =====================================================================
   공통 디자인 토큰 — 관제 / 연결 설정 / 장애 주입 / 로그인 화면이 함께 씁니다.
   색·글자·간격·모서리·모션 값은 여기에서만 바꿉니다.
   ===================================================================== */
:root {
  color-scheme: dark;

  /* 글꼴 */
  --font-sans: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  /* 글자 크기 단계 */
  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs-md: 14px;
  --fs-lg: 16px;
  --fs-xl: 20px;
  --fs-2xl: 26px;
  --lh-tight: 1.25;
  --lh-body: 1.5;
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;

  /* 간격 (4의 배수) */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;

  /* 모서리 */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;

  /* 바탕과 면 */
  --bg: #0B0F13;
  --surface-0: #0F141A;
  --surface-1: #141A21;
  --surface-2: #1B222B;
  --surface-3: #232C37;
  --line: #253039;
  --line-strong: #364350;

  /* 텍스트 */
  --text-1: #E7ECF1;
  --text-2: #A8B3BF;
  --text-3: #8591A0;
  --text-inverse: #0B0F13;

  /* 강조(선택·주요 동작) */
  --accent: #4CB4E6;
  --accent-strong: #2B7FB0;
  --accent-strong-hover: #236C97;
  --accent-soft: rgba(76, 180, 230, 0.14);
  --focus: #8FD3FF;

  /* 운행 상태 */
  --st-idle: #A3B4C6;
  --st-moving: #3FCF8E;
  --st-charging: #5AA8FF;
  --st-paused: #F0BE3C;
  --st-error: #FF5B61;
  --st-stale: #6E7A87;

  /* 알람 등급 */
  --sev-info: #5AA8FF;
  --sev-warn: #F0BE3C;
  --sev-critical: #FF5B61;

  /* 연결 상태 */
  --link-up: #3FCF8E;
  --link-down: #FF5B61;
  --link-unknown: #95A1AE;

  /* 상태 바탕(옅은 색) */
  --ok-soft: rgba(63, 207, 142, 0.12);
  --info-soft: rgba(90, 168, 255, 0.12);
  --warn-soft: rgba(240, 190, 60, 0.12);
  --danger-soft: rgba(255, 91, 97, 0.13);

  /* 맵 */
  --map-floor: #10161C;
  --map-grid: #18202A;
  --map-rack: #1A232C;
  --map-rack-line: #2A3542;
  --map-aisle: #2A3541;
  --map-wall: #4A5867;
  --map-label: #7F8B98;
  --map-marker-line: #E7ECF1;

  /* 크기 */
  --gnb-h: 52px;
  --control-h: 32px;
  --control-h-sm: 28px;

  /* 모션 */
  --dur-fast: 150ms;
  --dur-base: 220ms;
  --dur-slow: 360ms;
  --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
  --ease-in: cubic-bezier(0.5, 0, 0.8, 0.4);

  --shadow-pop: 0 12px 32px rgba(0, 0, 0, 0.45);
}

/* ===== 기본 ===== */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text-1);
  font-family: var(--font-sans);
  font-size: var(--fs-md);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===== 공통 컴포넌트: 버튼 ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-1);
  height: var(--control-h); padding: 0 var(--sp-3);
  border-radius: var(--radius-md); border: 1px solid var(--line-strong);
  background: var(--surface-2); color: var(--text-1);
  font-size: var(--fs-sm); font-weight: var(--fw-semibold); white-space: nowrap; cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
.btn:hover { background: var(--surface-3); border-color: var(--text-3); }
.btn:disabled { cursor: not-allowed; background: var(--surface-1); color: var(--text-3); border-color: var(--line); }
.btn-primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #FFFFFF; }
.btn-primary:hover { background: var(--accent-strong-hover); border-color: var(--accent-strong-hover); color: #FFFFFF; }
.btn-primary:disabled { background: var(--surface-1); border-color: var(--line); color: var(--text-3); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); border-color: var(--line); color: var(--text-1); }
.btn-sm { height: var(--control-h-sm); padding: 0 var(--sp-2); font-size: var(--fs-xs); }
.btn-icon { width: var(--control-h); padding: 0; }

/* 칩(필터) */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: var(--control-h-sm); padding: 0 var(--sp-2);
  border-radius: var(--radius-sm); border: 1px solid var(--line-strong);
  background: transparent; color: var(--text-3);
  font-size: var(--fs-xs); font-weight: var(--fw-semibold); cursor: pointer; white-space: nowrap;
  transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.chip:hover { color: var(--text-1); border-color: var(--text-3); }
.chip[aria-pressed="true"] { background: var(--surface-3); color: var(--text-1); border-color: var(--text-3); }
.chip .swatch { opacity: 0.4; }
.chip[aria-pressed="true"] .swatch { opacity: 1; }

/* 상태 배지 */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  height: 22px; padding: 0 var(--sp-2); border-radius: var(--radius-sm);
  font-size: var(--fs-xs); font-weight: var(--fw-semibold); white-space: nowrap;
  background: var(--surface-3); color: var(--text-1);
}
.badge[data-tone="ok"] { background: var(--ok-soft); color: var(--link-up); }
.badge[data-tone="info"] { background: var(--info-soft); color: var(--sev-info); }
.badge[data-tone="warn"] { background: var(--warn-soft); color: var(--sev-warn); }
.badge[data-tone="danger"] { background: var(--danger-soft); color: var(--sev-critical); }
.badge[data-tone="neutral"] { background: var(--surface-3); color: var(--text-2); }
.badge[data-tone="stale"] { background: transparent; color: var(--text-2); border: 1px dashed var(--st-stale); }

.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }

/* =====================================================================
   공통 상단 내비게이션 — 모든 화면에서 같은 자리, 같은 구조로 씁니다.
   ===================================================================== */
.gnb {
  display: flex; align-items: center; gap: var(--sp-5);
  height: var(--gnb-h); padding: 0 var(--sp-4) 0 var(--sp-5);
  background: var(--surface-0); border-bottom: 1px solid var(--line);
}
.gnb-brand { display: flex; align-items: center; gap: var(--sp-2); flex: none; }
.gnb-brand svg { display: block; }
.gnb-title { font-size: var(--fs-lg); font-weight: var(--fw-bold); letter-spacing: -0.01em; white-space: nowrap; }
.gnb-site { font-size: var(--fs-xs); color: var(--text-3); white-space: nowrap; }
.gnb-tabs { display: flex; align-self: stretch; }
.gnb-tab {
  display: flex; align-items: center; padding: 0 var(--sp-4);
  background: none; border: 0; border-bottom: 2px solid transparent;
  color: var(--text-2); font-size: var(--fs-md); font-weight: var(--fw-semibold); cursor: pointer; white-space: nowrap;
  transition: color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
}
.gnb-tab:hover { color: var(--text-1); background: var(--surface-1); }
.gnb-tab[aria-current="page"] { color: var(--text-1); border-bottom-color: var(--accent); }
.gnb-tab:focus-visible { outline-offset: -2px; }
a.gnb-tab { text-decoration: none; }
.gnb-end { display: flex; align-items: center; gap: var(--sp-3); margin-left: auto; }
.gnb-clock { font-size: var(--fs-sm); color: var(--text-2); }
.live-pill {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 var(--sp-2);
  border-radius: 13px; font-size: var(--fs-xs); font-weight: var(--fw-semibold); white-space: nowrap;
  background: var(--ok-soft); color: var(--link-up);
}
.live-pill[data-tone="info"] { background: var(--info-soft); color: var(--sev-info); }
.live-pill[data-tone="warn"] { background: var(--warn-soft); color: var(--sev-warn); }
.live-pill[data-tone="danger"] { background: var(--danger-soft); color: var(--sev-critical); }
.live-pill[data-pulse="true"] .dot { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
.gnb-divider { width: 1px; height: 24px; background: var(--line); }
.gnb-user { display: flex; align-items: center; gap: var(--sp-2); }
.avatar {
  display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  background: var(--surface-3); color: var(--text-1); font-size: var(--fs-xs); font-weight: var(--fw-bold);
}
.gnb-user-name { font-size: var(--fs-sm); font-weight: var(--fw-semibold); line-height: var(--lh-tight); white-space: nowrap; }

/* 토스트 */
.toasts { position: fixed; right: var(--sp-5); bottom: 64px; z-index: 20; display: grid; gap: var(--sp-2); pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); min-width: 260px; max-width: 420px;
  border-radius: var(--radius-md); background: var(--surface-3); border: 1px solid var(--line-strong); box-shadow: var(--shadow-pop);
  font-size: var(--fs-sm); animation: toast-in var(--dur-base) var(--ease-out);
}
.toast[data-tone="ok"] { border-left: 3px solid var(--link-up); }
.toast[data-tone="warn"] { border-left: 3px solid var(--sev-warn); }
.toast[data-tone="danger"] { border-left: 3px solid var(--sev-critical); }
.toast[data-tone="info"] { border-left: 3px solid var(--sev-info); }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* 데모 컨트롤 — 실제 제품 화면에는 없는 영역 */
.demo-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-5);
  padding: var(--sp-2) var(--sp-5);
  background: repeating-linear-gradient(-45deg, #161B10, #161B10 10px, #191F12 10px, #191F12 20px);
  border-top: 1px dashed #5C6B2E; color: #DCE7B5; font-size: var(--fs-xs);
}
.demo-tag { font-weight: var(--fw-bold); letter-spacing: 0.02em; white-space: nowrap; }
.demo-group { display: flex; align-items: center; gap: 4px; border: 0; padding: 0; margin: 0; }
.demo-group legend { float: left; margin-right: 6px; color: #B9C58F; }
.demo-opt { position: relative; }
.demo-opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.demo-opt span { display: inline-flex; align-items: center; height: 26px; padding: 0 var(--sp-2); border-radius: var(--radius-sm); border: 1px solid #4B5726; white-space: nowrap; cursor: pointer; }
.demo-opt:hover span { background: #232B16; }
.demo-opt input:checked + span { background: #DCE7B5; color: #12160B; border-color: #DCE7B5; font-weight: var(--fw-semibold); }
.demo-opt input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }


/* ===== 화면 뼈대 (로그인) ===== */
.login-app {
  display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 100vh;
  background-color: var(--bg);
  background-image: linear-gradient(var(--map-grid) 1px, transparent 1px), linear-gradient(90deg, var(--map-grid) 1px, transparent 1px);
  background-size: 40px 40px; background-position: center;
}
.login-main { display: grid; place-items: center; padding: var(--sp-6) var(--sp-4); }
.login-wrap { display: grid; gap: var(--sp-4); width: min(400px, 100%); }
.login-card { display: grid; gap: var(--sp-5); padding: var(--sp-6); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); background: var(--surface-1); box-shadow: var(--shadow-pop); }
.brand { display: grid; gap: var(--sp-3); }
.brand svg { display: block; }
.brand-title { font-size: var(--fs-2xl); font-weight: var(--fw-bold); line-height: var(--lh-tight); letter-spacing: -0.01em; }
.brand-desc { font-size: var(--fs-sm); color: var(--text-2); }

.notice { display: flex; align-items: flex-start; gap: var(--sp-2); padding: var(--sp-3); border: 1px solid; border-radius: var(--radius-md); font-size: var(--fs-sm); }
.notice .od-icon { margin-top: 3px; }
.notice[data-tone="danger"] { background: #1E1215; border-color: #6B2328; color: #FFD9DA; }
.notice[data-tone="warn"] { background: #221C0C; border-color: #5E4A17; color: #FCE7B0; }
.notice[data-tone="ok"] { background: #0F2219; border-color: #1F5A3F; color: #C9F2DD; }
.notice strong { display: block; font-weight: var(--fw-bold); }
.notice-body { display: grid; gap: 2px; }
.notice .link-btn { justify-self: start; margin-top: 4px; padding: 0; border: 0; background: none; color: inherit; font-weight: var(--fw-semibold); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.notice:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.login-form { display: grid; gap: var(--sp-4); }
.field { display: grid; gap: 6px; }
.field-label { font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-1); }
.input-lg {
  display: block; width: 100%; height: 44px; padding: 0 var(--sp-3);
  border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface-0); color: var(--text-1);
  font-size: var(--fs-lg); transition: border-color var(--dur-fast) var(--ease-out);
}
.input-lg::placeholder { color: var(--text-3); }
.input-lg:hover:not(:disabled) { border-color: var(--text-3); }
.input-lg:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; border-color: var(--accent); }
.input-lg[aria-invalid="true"] { border-color: var(--sev-critical); background: #1E1215; }
.input-lg:disabled { color: var(--text-2); background: var(--surface-1); cursor: not-allowed; }
.pw-wrap { display: flex; }
.pw-wrap .input-lg { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.pw-toggle {
  display: flex; align-items: center; justify-content: center; width: 52px; flex: none;
  border: 1px solid var(--line-strong); border-left: 0; border-radius: 0 var(--radius-md) var(--radius-md) 0;
  background: var(--surface-2); color: var(--text-2); font-size: var(--fs-xs); font-weight: var(--fw-semibold); cursor: pointer;
}
.pw-toggle:hover:not(:disabled) { background: var(--surface-3); color: var(--text-1); }
.pw-toggle:disabled { cursor: not-allowed; color: var(--text-3); }
.field-error { display: flex; align-items: flex-start; gap: 4px; font-size: var(--fs-sm); color: #FF9A9D; }
.field-error .od-icon { margin-top: 3px; }
.btn-block { width: 100%; height: 44px; font-size: var(--fs-md); }
.btn-block:disabled { cursor: progress; }
.spin { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin 0.8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

.demo-acct { display: grid; gap: var(--sp-2); padding: var(--sp-4); border: 1px dashed var(--line-strong); border-radius: var(--radius-md); background: rgba(20, 26, 33, 0.92); }
.demo-acct-title { font-size: var(--fs-sm); font-weight: var(--fw-bold); }
.demo-acct-desc { font-size: var(--fs-xs); color: var(--text-2); }
.demo-acct dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px var(--sp-3); font-size: var(--fs-sm); }
.demo-acct dt { color: var(--text-3); }
.demo-acct dd { font-family: var(--font-mono); color: var(--text-1); }
.demo-acct .btn { justify-self: start; }
.login-foot { font-size: var(--fs-xs); color: var(--text-3); text-align: center; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}
</style>
</head>
<body>
<div class="login-app">
  <main class="login-main">
    <div class="login-wrap">
      <section class="login-card" aria-labelledby="brandTitle">
        <div class="brand">
          <svg width="40" height="40" viewBox="0 0 26 26" aria-hidden="true">
            <rect x="1" y="1" width="24" height="24" rx="5" fill="none" stroke="#4CB4E6" stroke-width="2"/>
            <path d="M6 18 L11 8 L15 14 L20 7" fill="none" stroke="#E7ECF1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="20" cy="7" r="2" fill="#4CB4E6"/>
          </svg>
          <div class="od-stack" style="--od-gap:4px">
            <h1 class="brand-title" id="brandTitle">AGV·AMR 통합 관제</h1>
            <p class="brand-desc">1공장의 로봇 90대와 PLC 16점을 한 화면에서 관제합니다.</p>
          </div>
        </div>

        <div id="notice" hidden></div>

        <form class="login-form" id="loginForm" novalidate>
          <div class="field">
            <label class="field-label" for="userId">아이디</label>
            <input class="input-lg" id="userId" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" aria-describedby="userIdErr" aria-invalid="false">
            <span class="field-error" id="userIdErr" hidden></span>
          </div>
          <div class="field">
            <label class="field-label" for="password">비밀번호</label>
            <div class="pw-wrap">
              <input class="input-lg" id="password" name="password" type="password" autocomplete="current-password" aria-describedby="passwordErr" aria-invalid="false">
              <button type="button" class="pw-toggle" id="pwToggle" aria-controls="password" aria-pressed="false" aria-label="비밀번호 보기">보기</button>
            </div>
            <span class="field-error" id="passwordErr" hidden></span>
          </div>
          <button type="button" class="btn btn-primary btn-block" id="submitBtn">로그인</button>
        </form>
      </section>

      <!-- 심사용 데모 계정: 실제 배포 시 값을 바꿔 넣는 자리 -->
      <section class="demo-acct" aria-labelledby="acctTitle">
        <h2 class="demo-acct-title" id="acctTitle">심사용 데모 계정</h2>
        <p class="demo-acct-desc">과제 심사를 위해 마련한 계정입니다. 모든 기능을 같은 권한으로 쓸 수 있습니다.</p>
        <dl>
          <dt>아이디</dt><dd id="demoId">reviewer</dd>
          <dt>비밀번호</dt><dd id="demoPw">agv-demo-2026</dd>
        </dl>
        <button type="button" class="btn btn-sm" id="fillDemo">입력란에 채우기</button>
      </section>

      <p class="login-foot">1공장 관제실 전용 시스템입니다. 접속이 안 되면 시스템 관리자에게 문의하세요.</p>
    </div>
  </main>

  <!-- 데모 컨트롤: 실제 제품 화면에는 없는 영역입니다 -->
  <footer class="demo-bar" aria-label="데모 컨트롤">
    <span class="demo-tag">데모 컨트롤 · 실제 화면에는 없음</span>
    <fieldset class="demo-group" id="demoResult">
      <legend>다음 로그인 결과</legend>
      <label class="demo-opt"><input type="radio" name="result" value="auto" checked><span>자동 (데모 계정이면 성공)</span></label>
      <label class="demo-opt"><input type="radio" name="result" value="401"><span>아이디·비밀번호 틀림 401</span></label>
      <label class="demo-opt"><input type="radio" name="result" value="network"><span>서버 연결 불가</span></label>
      <label class="demo-opt"><input type="radio" name="result" value="hang"><span>응답 없음 (로그인 중 고정)</span></label>
    </fieldset>
    <fieldset class="demo-group" id="demoEntry">
      <legend>진입</legend>
      <label class="demo-opt"><input type="radio" name="entry" value="normal" checked><span>일반</span></label>
      <label class="demo-opt"><input type="radio" name="entry" value="expired"><span>세션 만료로 진입</span></label>
    </fieldset>
  </footer>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
'use strict';

/* ===== 상수 ===== */
const LOGIN_MS = 900;
const REDIRECT_MS = 700;
const LAST_USER_ID = 'kim.doyoon';
const NEXT_PAGE = 'monitor.html';

/* ===== 아이콘 ===== */
const ICON_PATHS = {
  critical: '<path d="M8.2 3h7.6L21 8.2v7.6L15.8 21H8.2L3 15.8V8.2z"/><path d="M12 8v5"/><path d="M12 16v.3"/>',
  unplug: '<path d="M4 20l4-4"/><path d="M20 4l-4 4"/><path d="M7 13l4 4"/><path d="M13 7l4 4"/><path d="M3 3l18 18"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
};
const icon = (name, size) => `<svg class="od-icon"${size ? ` style="--od-icon-size:${size}px"` : ''} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name]}</svg>`;

/* ===== 요소 ===== */
const els = {
  form: document.getElementById('loginForm'),
  id: document.getElementById('userId'),
  pw: document.getElementById('password'),
  idErr: document.getElementById('userIdErr'),
  pwErr: document.getElementById('passwordErr'),
  pwToggle: document.getElementById('pwToggle'),
  submit: document.getElementById('submitBtn'),
  notice: document.getElementById('notice'),
};
const state = { result: 'auto', busy: false, reqId: 0 };

/* ===== 표시 ===== */
const setNotice = (tone, title, body = '', action = '') => {
  if (!tone) { els.notice.hidden = true; els.notice.innerHTML = ''; return; }
  els.notice.hidden = false;
  els.notice.className = 'notice';
  els.notice.dataset.tone = tone;
  els.notice.setAttribute('role', tone === 'danger' ? 'alert' : 'status');
  els.notice.tabIndex = -1;
  const iconName = { danger: tone === 'danger' && action ? 'unplug' : 'critical', warn: 'clock', ok: 'check' }[tone];
  els.notice.innerHTML = `${icon(iconName, 16)}<div class="notice-body"><strong>${title}</strong>${body ? `<span>${body}</span>` : ''}${action}</div>`;
};
const setFieldError = (input, errEl, msg) => {
  input.setAttribute('aria-invalid', String(!!msg));
  errEl.hidden = !msg;
  errEl.innerHTML = msg ? `${icon('critical')}<span>${msg}</span>` : '';
};
const setBusy = (busy, label) => {
  state.busy = busy;
  els.id.disabled = busy;
  els.pw.disabled = busy;
  els.pwToggle.disabled = busy;
  els.submit.disabled = busy;
  els.submit.innerHTML = label || '로그인';
  els.form.setAttribute('aria-busy', String(busy));
};

/* ===== 로그인 ===== */
const validate = () => {
  const idMsg = els.id.value.trim() ? '' : '아이디를 입력하세요.';
  const pwMsg = els.pw.value ? '' : '비밀번호를 입력하세요.';
  setFieldError(els.id, els.idErr, idMsg);
  setFieldError(els.pw, els.pwErr, pwMsg);
  if (idMsg) els.id.focus(); else if (pwMsg) els.pw.focus();
  return !idMsg && !pwMsg;
};
const isDemoAccount = () => els.id.value.trim() === document.getElementById('demoId').textContent && els.pw.value === document.getElementById('demoPw').textContent;

const submit = () => {
  if (state.busy) return;
  if (!validate()) return;
  setNotice(null);
  setBusy(true, '<span class="spin" aria-hidden="true"></span>로그인 중…');
  const req = ++state.reqId;
  if (state.result === 'hang') return;
  setTimeout(() => {
    if (req !== state.reqId) return;
    const outcome = state.result === 'auto' ? (isDemoAccount() ? 'ok' : '401') : state.result;
    if (outcome === 'ok') {
      setBusy(true, `${icon('check')}로그인됨 — 관제 화면으로 이동합니다`);
      setNotice('ok', '로그인되었습니다', '잠시 후 관제 화면으로 이동합니다.');
      setTimeout(() => { window.location.href = NEXT_PAGE; }, REDIRECT_MS);
      return;
    }
    setBusy(false);
    if (outcome === '401') {
      els.pw.value = '';
      setNotice('danger', '아이디 또는 비밀번호가 맞지 않습니다', '대소문자와 Caps Lock을 확인한 뒤 다시 입력해 주세요.');
      setFieldError(els.pw, els.pwErr, '비밀번호를 다시 입력하세요.');
      els.pw.focus();
      return;
    }
    setNotice('danger', '서버에 연결할 수 없습니다', '네트워크 연결을 확인하거나 잠시 후 다시 시도해 주세요. 입력한 내용은 그대로 남아 있습니다.',
      '<button type="button" class="link-btn" id="retryBtn">다시 시도</button>');
    els.notice.focus();
  }, LOGIN_MS);
};

const applyEntry = (entry) => {
  state.reqId += 1;
  setBusy(false);
  setFieldError(els.id, els.idErr, '');
  setFieldError(els.pw, els.pwErr, '');
  els.pw.value = '';
  if (entry === 'expired') {
    els.id.value = LAST_USER_ID;
    setNotice('warn', '세션이 만료되었습니다', '오랫동안 사용하지 않아 자동으로 로그아웃되었습니다. 다시 로그인하면 보던 화면으로 돌아갑니다.');
    els.pw.focus();
  } else {
    els.id.value = '';
    setNotice(null);
    els.id.focus();
  }
};

/* ===== 이벤트 ===== */
els.submit.addEventListener('click', submit);
els.form.addEventListener('submit', (e) => { e.preventDefault(); submit(); });
[els.id, els.pw].forEach((input) => {
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
  input.addEventListener('input', () => { if (input.getAttribute('aria-invalid') === 'true' && input.value) setFieldError(input, input === els.id ? els.idErr : els.pwErr, ''); });
});
els.pwToggle.addEventListener('click', () => {
  const show = els.pw.type === 'password';
  els.pw.type = show ? 'text' : 'password';
  els.pwToggle.textContent = show ? '숨기기' : '보기';
  els.pwToggle.setAttribute('aria-pressed', String(show));
  els.pwToggle.setAttribute('aria-label', show ? '비밀번호 숨기기' : '비밀번호 보기');
});
els.notice.addEventListener('click', (e) => { if (e.target.closest('#retryBtn')) submit(); });
document.getElementById('fillDemo').addEventListener('click', () => {
  if (state.busy) return;
  els.id.value = document.getElementById('demoId').textContent;
  els.pw.value = document.getElementById('demoPw').textContent;
  setFieldError(els.id, els.idErr, '');
  setFieldError(els.pw, els.pwErr, '');
  els.submit.focus();
});

// 데모 컨트롤
document.getElementById('demoResult').addEventListener('change', (e) => {
  if (e.target.name !== 'result') return;
  state.result = e.target.value;
  if (state.busy) { state.reqId += 1; setBusy(false); }
});
document.getElementById('demoEntry').addEventListener('change', (e) => {
  if (e.target.name === 'entry') applyEntry(e.target.value);
});

/* ===== 시작 ===== */
const startExpired = new URLSearchParams(window.location.search).get('reason') === 'expired';
if (startExpired) document.querySelector('#demoEntry input[value="expired"]').checked = true;
applyEntry(startExpired ? 'expired' : 'normal');
</script>
</body>
</html>
